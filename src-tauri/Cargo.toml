[package]
name = "folio-desktop"
version = "0.1.1"
description = "An independent local-first PDF workspace"
license = "Apache-2.0"
edition = "2024"
default-run = "folio"

[lib]
name = "folio_core"

[[bin]]
name = "folio"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "folio-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:tauri-plugin-opener"]
preview = ["dep:tiny_http", "dep:percent-encoding"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
lopdf = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ttf-parser = "0.25"
unicode-normalization = "0.1"
png = "0.18"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-opener = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }
tiny_http = { version = "0.12", optional = true }
percent-encoding = { version = "2", optional = true }
openssl = { version = "0.10.81", features = ["vendored"] }
cms = "0.2.3"
der = "0.7.10"
x509-cert = "0.2.5"
zeroize = "1"

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.release]
# macOS 27 dyld rejects the misaligned LINKEDIT pool in stripped proc-macro dylibs.
strip = "none"
